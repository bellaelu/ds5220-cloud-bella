apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
  labels:
    app: kafka
spec:
  clusterIP: None
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: kafka
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          command:
            - /bin/bash
            - -c
            - |
              ORDINAL=${HOSTNAME##*-}
              CFG=/opt/kafka/config/kraft/server.properties
 
              sed -i "s|^advertised.listeners=.*|advertised.listeners=PLAINTEXT://${HOSTNAME}.kafka-headless.kafka.svc.cluster.local:9092,CONTROLLER://${HOSTNAME}.kafka-headless.kafka.svc.cluster.local:9093|" $CFG
              sed -i "s|^listeners=.*|listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093|" $CFG
              sed -i "s|^node.id=.*|node.id=$ORDINAL|" $CFG
              sed -i "s|^process.roles=.*|process.roles=broker,controller|" $CFG
              sed -i "s|^controller.quorum.voters=.*|controller.quorum.voters=0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093|" $CFG
              sed -i "s|^log.dirs=.*|log.dirs=/tmp/kraft-combined-logs|" $CFG
 
              /opt/kafka/bin/kafka-storage.sh format \
                --config $CFG \
                --cluster-id "MkU3OEVBNTcwNTJENDM2Qk" \
                --ignore-formatted
 
              exec /opt/kafka/bin/kafka-server-start.sh $CFG
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"